[project]
name = "pullback"
version = "0.1.0"
description = "위키독스 「AI로 검증하는 주도주 눌림매매 따라하기」 예제 코드"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "finance-datareader>=0.9.202",
    "lightgbm>=4.7.0",
    "openai>=2",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scikit-learn>=1.9.1",
    "shap>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
