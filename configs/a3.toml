# A3 = B0 v1.2 + 위험관리 구성요소 (12장)
#
# 사전 등록 문서. 12장의 수량·추가 매수·노출 한도 결과를 보기 전에 등록했다.
# 원래 계획(01-3)의 A3 는 'A2 + 동적 위험관리' 였으나 A1·A2 가 기각(09·10장)되어 B0 위에 얹는다.
# 여기서 '채택' 은 B0 위에 남길 위험관리 구성요소라는 뜻이다. B0 자체가 손실 전략이므로
# 채택된 구성요소가 있어도 전략이 이익을 낸다는 뜻은 아니다.

[meta]
id = "A3"
version = "1.0"
registered = "2026-11-05"
base = "configs/b0.toml v1.2"
deviation = "A3 의 바탕을 A2 에서 B0 로 변경 (A1·A2 기각). 확률 기반 비중 조절은 A1 확률이 무작위와 구별되지 않아(11-2) 시험하지 않는다."
seen_before_registration = "B0 개발·검증 성과, 07-3 의 2차 매수·손절 변형 결과, 11장 비교. 아래 구성요소의 결과는 보지 않음"

[components]                        # 한 번에 하나씩 B0 에 더해 각각 판정한다 (조합은 판정 뒤)
P1 = "변동성 비례 수량: 1차 매수 금액 = 100만 원 x w, w = c / atr_pct(신호일 ATR14/종가), [0.33, 3] 로 자름. c 는 개발 구간 B0 거래의 w 평균이 1 이 되게 정한다 (수익률 미사용)"
C1 = "조건부 2차 매수: 2차 매수가 아래로 갭 하락해 시가에 체결될 날(시가 < 2차 매수가)에는 2차 매수를 하지 않는다"
E1 = "동시 보유 한도: 보유 종목이 20개면 새 1차 체결을 받지 않는다 (같은 날 후보는 종목코드 순)"
E2 = "테마 집중 제한: 신호일의 동반 급등 종목(05-2 peers) 중 이미 보유한 종목이 2개 이상이면 새 1차 체결을 받지 않는다"

[secondary]                         # 보고만 한다
L1 = "월간 손실 한도: 그 달 청산된 거래의 실현 손실 합이 자본의 3% 를 넘으면 그 달 남은 기간 새 1차 체결을 받지 않는다"
approximation = "E1·E2·L1 은 B0 거래 목록에서 거래를 건너뛰는 방식으로 근사한다. 건너뛴 파동에 나중에 다시 들어가는 경우는 반영하지 않는다"

[metrics]
primary = "투입 자본 연환산 수익률 = 손익 합 / sum(거래별 투입 금액 x 보유 거래일) x 250"
mdd = "계좌 MDD(원) / 평균 투입 금액"
account = "1억 원, 기준 1차 매수 100만 원, 복리 없음"
periods = { dev = ["2021-01-01", "2024-12-31"], validation = ["2025-01-01", "2025-12-31"] }

[random_benchmark]
P1 = "w 를 거래끼리 무작위로 섞기"
C1 = "2차가 체결된 거래 중 같은 수를 무작위로 골라 2차를 빼기"
E1_E2 = "B0 거래 중 같은 수를 무작위로 건너뛰기"
draws = 2000
seed = 0

[adoption]                          # 구성요소마다 모두 만족해야 채택
dev_rodc_better = true              # 개발 구간 투입 자본 연환산 수익률 > B0
dev_mdd_per_exposure_not_worse = true
validation_rodc_not_worse = true    # 2025 투입 자본 연환산 수익률 >= B0
random_p95 = true                   # 개발 구간 효과가 무작위 기준 분포의 95 백분위 초과
cost_stress_holds = true            # 슬리피지 0.3% 에서도 dev_rodc_better, validation_rodc_not_worse 유지
holdout = "2026, 14장에서 한 번만"
