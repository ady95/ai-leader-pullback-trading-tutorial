# 15장 운영 시스템 검증 명세서 (사전 등록)
#
# 14-3절 판정은 "H1 기각 확정"이었다. 그래서 5부의 목적은 수익이 아니라 시스템 검증이다.
# 이 명세서는 운영 코드(src/pullback/live/)를 만들기 전에 커밋하며, 아래 기준은 결과를 보고 바꾸지 않는다.
# 기준을 못 넘으면 고치고 다시 재되, 무엇이 틀렸는지를 15장 본문에 적는다.

[meta]
id = "LIVE-15"
version = "1.0"
registered = "2026-11-05"
purpose = "운영 시스템이 B0 백테스트와 같은 결정을 내리는지, 매일 밤 실제로 돌릴 수 있는지 검증"

[strategy]
spec = "configs/b0.toml"           # B0 v1.2 (sha256 aa61cf3589d3431d...)
prediction = "none"                # 9~11장의 A1·A2는 채택되지 않음. 예측 모듈은 인터페이스만 두고 끈다
risk_components = []               # 12~14장의 구성요소 12개 모두 채택되지 않음
capital = 1e8
first_money = 1e6                  # 1차 매수 금액. 2차는 1차와 같은 주식 수 (second_units = 1.0)
compounding = false

[checks.parity]                    # 15-1: 운영 엔진(하루씩, 상태 파일) == 백테스트 엔진(종목별 일괄)
replay_start = "2020-01-02"
replay_end = "2026-11-03"
compare = ["code", "date", "kind", "price", "units", "reason"]
price_rel_tol = 1e-9
max_mismatch = 0                   # 이벤트 하나라도 다르면 실패
open_positions_at_end = "same_as_backtest_data_end"   # 백테스트의 data_end 거래 = 운영 엔진의 미청산 보유

[checks.truncation]                # 15-2: 장 마감 배치는 t일까지의 데이터만 읽는다
days = 20                          # 저장소의 마지막 20거래일
lookback_calendar_days = 400       # 배치가 읽는 기간 (지표 최장 창 120거래일 + 여유)
compare = ["code", "first_price", "peak_date"]
price_rel_tol = 1e-9
max_mismatch = 0
max_batch_seconds = 120            # 신호 계산만 (데이터 수집 제외)

[checks.watchlist]                 # 15-2: 매일 갱신할 종목 = 최근 60거래일 안에 상한가가 있었던 종목 + 보유 종목
rule = "limit_up_within_last_60_bars"
coverage_min = 1.0                 # 2021~2026 B0 후보일 전부가 전날 감시 목록 또는 당일 신규 상한가에 들어 있어야 한다
new_limit_up_source = "ka10017"    # 상하한가요청 (당일 상한가 종목)
refresh = "ka10081 1 page per stock (최근 600거래일, 수정주가 재계산 포함)"

[checks.live_run]                  # 15-2: 실제 장 마감 데이터로 배치를 돌린다 (주문은 내지 않는다)
dates = ["2026-11-04", "2026-11-05"]
fills = "simulated"                # 16장 전까지 체결은 백테스트 규칙으로 가정
output = "다음 거래일 주문 계획 (2026-11-06)"
max_minutes = 30                   # 모의투자 서버 1초 1건 기준, 수집 포함

[checks.websocket]                 # 15-2: 장중 감시 채널
url_mode = "paper"
login_return_code = 0
reg_types = ["00"]                 # 주문체결. B0는 일봉 전략이라 시세 구독(0B)은 필수가 아니다
hold_minutes = 10                  # PING에 응답하며 연결 유지
market_hours_test = "17-1"         # 장중 체결 통보 수신은 모의매매 운영 시험에서 잰다

[checks.audit]                     # 15-3
chain = "sha256(prev_hash + record)"
verify_replay_log = true
tamper_test = "한 줄을 고치면 그 줄에서 검증이 실패해야 한다"

[checks.dashboard]                 # 15-3
tool = "streamlit"
test = "streamlit.testing AppTest 로 화면을 그려 예외가 없어야 한다"

[order_conversion]                 # 15-1: 백테스트 가정을 실제 주문으로 옮길 때의 차이 (서술 통계, 채택 판단 없음)
tick_rounding = "매수 지정가는 호가 단위 내림, 매도 지정가는 올림, 상한가 매도는 상한가 정확히"
shares = "1차 floor(first_money / 지정가), 1차 익절 floor(보유 / 2)"
report_period = "2021-01-01 ~ 2026-11-03"
