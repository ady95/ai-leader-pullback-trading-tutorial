# 11장 비교 설계 (사전 등록)
#
# B0·B1·A1·A2 의 개별 판정(07·09·10장)은 끝났다. 이 문서는 그 판정을 같은 조건에서 다시 점검하는
# 방법을 결과를 보기 전에 정해 둔다. 무작위 기준은 새로 하는 시험이며, 그 결과는 아직 보지 않았다.

[meta]
id = "compare_11"
version = "1.0"
registered = "2026-11-04"
seen_before_registration = "B0·B1·A1·A2 각각의 개발·검증 성과와 판정 (07·09·10장)"

[strategies]
B0 = "configs/b0.toml v1.2"
B1 = "configs/b1.toml v1.0 (지수 >= 60일선일 때만 1차 주문)"
A1 = "configs/a1.toml v1.1 (Walk-forward 보정 확률 >= 0.30)"
A2 = "configs/a2.toml v1.0 (고점 이후 LLM 악재 공시 없을 때만)"

[conditions]                         # 11-2 동일 조건
data = "같은 일봉 데이터 지문, 같은 B0 후보일, 2020 워밍업 신호부터 시뮬레이션, 2026 신호 제외"
windows = { common = ["2022-01-01", "2024-12-31"], validation = ["2025-01-01", "2025-12-31"] }  # A1 의 예측 구간이 2022 부터라 공통 비교 구간은 2022~2024
account = "1억 원, 1차 매수 100만 원, 복리 없음"
slippage_grid = [0.0, 0.001, 0.003, 0.005]
exposure = "평균 투입 금액 대비 손익도 함께 보고 (거래 수가 적은 전략이 위험을 덜 진 효과를 보정)"

[random_benchmark]                   # 11-2 거래 수 차이 보정
unit = "B0 거래 집합에서, 필터가 남긴 거래와 같은 수를 무작위로 고른 부분집합"
draws = 2000
seed = 0
stratified = "연도별 남긴 거래 수를 그대로 맞춘 무작위 (연도 고르기 효과와 종목 고르기 효과를 나눔)"
statistic = ["거래당 평균", "계좌 손익 합계"]

[judgement]                          # 11-3
indistinguishable = "남긴 거래의 거래당 평균이 무작위 부분집합 분포의 95 백분위 이하이면 '무작위 필터와 구별되지 않음'"
verdict_change = "이 점검은 07·09·10장의 판정을 바꾸지 않는다. 판정이 유지되는지 확인만 한다"
holdout = "열지 않는다 (14장)"
