# A2 = B0 v1.2 + LLM 공시 악재 필터 (10장)
#
# 사전 등록 문서. 공시 분류·매매 결과를 보기 전에 등록했다.
# 원래 계획(01-3)의 A2 는 'A1 + LLM' 이었으나 A1 이 기각(09-3)되어 B0 위에 바로 얹는다.

[meta]
id = "A2"
version = "1.0"
registered = "2026-11-04"
base = "configs/b0.toml v1.2"
deviation = "01-3 의 A2 = A1 + LLM 에서 A2 = B0 + LLM 으로 변경. 이유: A1 기각(09-3). 뉴스 기사는 과거 시점 데이터를 합법적으로 대량 확보할 출처가 없어 DART 공시만 쓴다."
seen_before_registration = "B0 개발·검증 성과(07장), A1 결과(09장). 공시 데이터·분류 결과는 보지 않음"
edits = "등록 뒤 수정은 [llm] model 설명에서 내부 모델 이름을 지운 것뿐 (규칙·기준 변경 없음)"

[data]                              # 10-1
source = "OpenDART list.json, 후보 종목(B0 주문일이 있는 종목) 전체, 2020-01-01 ~"
available = "접수일자 rcept_dt <= t 인 공시만 t일 장 마감 뒤 판단에 사용 (시각 정보 없음)"
amendment = "제목이 '[' 로 시작하는 공시(기재정정·첨부정정·발행조건확정 등)는 새 사건으로 세지 않는다"
news = "사용하지 않음"

[llm]                               # 10-1, 10-2
input = "정규화한 공시 제목만. 회사명·날짜·종목코드는 보내지 않는다 (사후 지식 유입 차단)"
output = "category(12종), impact(호재·악재·중립), material(bool)"
model = "환경변수 OPENAI_MODEL (OpenAI 호환 API 의 범용 대화 모델)"
prompt = "src/pullback/disclosure.py PROMPT, 해시를 결과에 기록"
cache = "제목별 분류 결과를 한 번 만들어 고정. 평가 중 다시 분류하지 않는다"

[filter]                            # 10-3 채택 판정 대상 (하나만)
rule = "t일에 B0 1차 주문을 내려 할 때, 파동 고점일 ~ t일 사이에 LLM 이 '악재'로 분류한 공시(정정 제외)가 있으면 그날 주문하지 않는다"

[secondary]                         # 보고만 하고 채택 판정에는 쓰지 않는다
keyword_filter = "같은 규칙을 키워드 분류(disclosure.py BAD_WORDS)로 바꾼 결과"
freshness = "상승 구간(저점~고점)에 '호재·material' 공시가 있는 파동과 없는 파동, 그중 최근 365일 같은 범주 재료가 없던 '새 재료' 파동의 B0 성과 비교"
lightgbm = "A1 특징량 26개 + 공시 특징량으로 09장과 같은 Walk-forward 를 돌려 AUC 변화만 진단"

[periods]
dev = ["2021-01-01", "2024-12-31"]  # 학습이 없으므로 개발 구간 전체를 평가
validation = ["2025-01-01", "2025-12-31"]
holdout = "2026, 14장에서 한 번만"

[adoption]                          # 모두 만족해야 채택 (08-0 의 A1 기준과 같은 엄격도)
dev_account_pnl_positive = true     # 2021~2024 계좌 손익 > 0 (1억, 1차 매수 100만 원)
dev_money_weighted_positive = true  # 같은 구간 금액 가중 평균 순수익률 > 0
validation_better_than_b0 = true    # 2025 거래당 평균 > B0, 계좌 MDD 가 B0 보다 나쁘지 않음
cost_stress_holds = true            # 슬리피지 0.3% 에서도 위 조건 유지
filtered_out_worse = true           # 걸러낸 거래 평균 < 남긴 거래 평균 (개발·검증 구간 각각)
min_trades = 100                    # 2021~2024 거래 수
min_filtered = 30                   # 2021~2024 걸러낸 B0 거래 수 (너무 적으면 효과를 판단할 수 없음)
