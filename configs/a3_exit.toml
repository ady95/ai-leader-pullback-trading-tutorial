# A3 청산 구성요소 (13장) = B0 v1.2 + 청산 규칙 하나
#
# 사전 등록 문서. 아래 구성요소의 결과를 보기 전에 등록했다.
# 12장(configs/a3.toml)과 같은 판정 지표·채택 기준을 쓴다. 12장에서 채택된 구성요소가 없으므로 바탕은 B0 그대로다.
# '채택' 은 B0 위에 남길 청산 구성요소라는 뜻이다. B0 자체가 손실 전략이므로 전략이 이익을 낸다는 뜻은 아니다.

[meta]
id = "A3-X"
version = "1.0"
registered = "2026-11-05"
base = "configs/b0.toml v1.2"
seen_before_registration = """B0 개발·검증 성과와 청산 사유 분포(07-1), 07-3 의 '익절 고정 +25% 전량'(X1)과 '시간 청산 20거래일'(T1) 결과,
11-3 시행 대장. 개발 구간 B0 거래의 신호일 ATR/종가 분포(중앙 0.1028, 수익률과 무관)와 보유 일수 분포. X2·X3·X4·T2 결과는 보지 않음"""
seen_components = ["X1", "T1"]     # 07-3 에서 이미 결과를 봤다. 같은 기준으로 판정하되 '사전 등록 아님' 으로 표시한다
ai_reevaluation = "시험하지 않는다. 진입 시점의 A1 확률조차 무작위와 구별되지 않았다(11-2)"

[components]                        # 한 번에 하나씩 B0 에 더해 각각 판정한다
X1 = "고정 목표 전량: 평균 단가 +25% 에 닿으면 전량 매도 (B0 의 +20% 절반·상한가 잔여 대신). 07-3 [variants] take_profit fixed_0.25"
X2 = "낮은 1차 익절: 1차 익절을 평균 단가 +10% 에 절반 (B0 +20%). 잔여는 B0 와 같이 상한가 매도"
X3 = "ATR 손절: 손절선 = 1차 체결가 x (1 - k x atr_pct), atr_pct = 신호일 ATR14/종가, k = 0.669 (개발 구간 B0 거래의 손절 거리 중앙값이 B0 의 6.88% 와 같아지는 값). 판정·체결은 B0 와 같다 (종가 이탈, 다음 날 시가)"
X4 = "트레일링 스톱: 1차 체결 다음 날부터의 최고 고가가 평균 단가 +10% 이상이 된 뒤, 종가 < 최고 고가 x (1 - k x atr_pct) 이면 다음 날 시가 전량 매도. k 는 X3 과 같다. B0 의 익절·손절은 그대로 둔다"
T1 = "시간 청산 20거래일 (B0 60거래일). 07-3 [variants] max_hold_days 20"
T2 = "무진전 청산: 1차 체결 뒤 10거래일째 종가가 평균 단가 아래면 다음 날 시가 전량 매도. 그 외는 B0 와 같다"

[metrics]
primary = "투입 자본 연환산 수익률 (12장과 같다)"
mdd = "계좌 MDD(원) / 평균 투입 금액"
diagnostics = ["거래당 평균", "청산 사유 분포", "MFE(보유 중 최대 유리 변동) 대비 실현 비율", "연간 매도 횟수와 비용 합"]
account = "1억 원, 1차 매수 100만 원, 복리 없음"
periods = { dev = ["2021-01-01", "2024-12-31"], validation = ["2025-01-01", "2025-12-31"] }

[random_benchmark]
timing = """X1·X2·X4·T1·T2: 결과가 바뀐 거래 수 n 만큼 개발 구간 B0 거래를 무작위로 고르고, 바뀐 거래들의 보유 일수를 섞어 나눠 준 뒤
그 날짜에 전량 청산한 것으로 바꾼다(B0 청산보다 늦으면 B0 그대로). '같은 수의 거래를 같은 정도로 일찍 판 무작위 청산' 과 비교한다. 2000회"""
X3 = "atr_pct 를 거래끼리 섞어 손절선을 다시 정한 엔진 실행. 실행 비용 때문에 300회"
seed = 0

[adoption]                          # 12장 configs/a3.toml 과 같다. 구성요소마다 모두 만족해야 채택
dev_rodc_better = true
dev_mdd_per_exposure_not_worse = true
validation_rodc_not_worse = true
random_p95 = true
cost_stress_holds = true            # 슬리피지 0.3%
combination = "둘 이상 채택되면 조합을 한 번 보고만 한다. 조합은 따로 채택하지 않고 14장 홀드아웃에서 개별 채택 구성요소를 B0 에 함께 얹어 한 번 평가한다"
holdout = "2026, 14장에서 한 번만"
