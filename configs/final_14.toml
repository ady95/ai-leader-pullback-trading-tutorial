# 14장 시장 국면 규칙, 스트레스 시험, 최종 홀드아웃 명세서
#
# 사전 등록 문서. 14-1 국면 규칙의 결과, 14-2 스트레스 결과, 2026 홀드아웃의 어떤 전략 성과도 보기 전에 등록했다.
# 홀드아웃(2026-01-01 ~ 2026-11-03)은 14-3 에서 이 파일의 규칙대로 한 번만 연다.

[meta]
id = "FINAL-14"
version = "1.0"
registered = "2026-11-05"
base = "configs/b0.toml v1.2"
seen_before_registration = """B0·변형의 2020~2025 성과 전부(07~13장), 12-3 의 '진입 시 보유 20종목 이상' 사후 관찰(2020 반대, 2021 양),
B1(지수 60일선)·B1_alt(지수 20일 수익률 >= 0) 결과(07-2), 지수 일간 -8% 이하 날짜 목록(07-3, 2026 포함 — 지수 값이며 전략 성과 아님).
2026 년 전략 성과는 어떤 형태로도 보지 않음"""
adopted_before = "12·13장에서 채택된 구성요소 없음. 홀드아웃 기본 대상은 B0 v1.2"

[regime]                            # 14-1: 신호일(t) 장 마감 기준, 종목이 속한 시장 지수로 판정. 하나씩 B0 에 더해 판정한다
R1 = "급락 직후 진입 금지: 신호일 포함 최근 5거래일 중 지수 일간 수익률 <= -3% 인 날이 있으면 그날 1차 주문을 내지 않는다"
R2 = "깊은 하락장 진입 금지: 신호일 지수 20거래일 수익률 <= -10% 이면 1차 주문을 내지 않는다"
note = "B1(지수 >= 60일선)과 B1_alt(20일 수익률 >= 0)는 07-2·11-2 에서 이미 기각. R1·R2 는 '평소엔 그대로, 극단에서만 멈춘다' 는 더 좁은 규칙"
adoption = "configs/a3.toml [adoption] 다섯 조건과 같다 (투입 자본 연환산, MDD/평균 투입, 2025, 무작위 95 백분위, 슬리피지 0.3%). 무작위 기준 = B0 거래 중 같은 수(연도별 층화 없이)를 무작위로 건너뛰기 2000회, seed 0"
min_skipped = 30                    # 개발 구간에서 건너뛴 거래가 30건 미만이면 판정 보류 (효과를 잴 수 없음)

[regime_hypothesis]                 # 채택 대상이 아니다. 홀드아웃에서 서술 통계로만 보고한다
busy = "12-3 사후 관찰: 진입 시 이미 보유한 B0 종목이 20개 이상인 거래의 평균이 나머지보다 높다. 2020 반대, 2021 지지로 방향이 엇갈렸다. 홀드아웃에서 두 집단의 건수·평균만 보고하고 규칙으로 쓰지 않는다"

[stress]                            # 14-2: 개발·검증 구간에서 먼저 보고, 같은 항목을 14-3 홀드아웃에 그대로 적용한다
slippage_grid = [0.0, 0.001, 0.003, 0.005]
strict_touch = true                 # 저가가 지정가보다 낮아야 체결
drop_best = 0.05                    # 거래당 수익률 상위 5% 거래를 뺐을 때 평균
crash_days = "지수 일간 -5% 이하인 날 (KOSPI 또는 KOSDAQ). 그날 보유 중이던 B0 거래의 그날 하루 평가 손익과 최종 손익"
walk_forward = """해마다(2022~2025) 그 전 해까지의 성과로 '대장 변형 중 1위' 를 골라 다음 해에 썼을 때의 성과를 B0 와 비교한다.
후보 = 엔진으로 다시 계산할 수 있는 변형: B0, 07-3 의 2차·손절·청산 변형, 13장 X1~T2. 1위 기준 = 지난 해까지 누적 투입 자본 연환산.
홀드아웃에는 적용하지 않는다 (홀드아웃은 B0 와 14-1 채택 규칙만)"""

[holdout]                           # 14-3
window = ["2026-01-01", "2026-11-03"]
targets = "B0 v1.2. 14-1 에서 채택된 국면 규칙이 있으면 B0 + 그 규칙도 함께 (각각 한 번)"
signals = "후보일 2026-11-02 까지(다음 날 주문 가능). 2026-11-03 장 마감에 보유 중인 거래는 그날 종가로 평가하고 '미청산' 으로 따로 센다"
min_trades = 100                    # 미만이면 평균의 부호와 무관하게 '판정 보류'
bootstrap = "월 단위 클러스터, 95% 구간 (11장과 같다)"
reopen = "다시 열지 않는다. 결과를 보고 규칙을 바꾸면 그 규칙은 새 홀드아웃(2026-11-04 이후 모의매매 기간)에서만 판정한다"

[holdout.verdict]                   # B0 에 대한 판정. 위에서부터 처음 맞는 것
confirmed = "거래당 평균 > 0, 부트스트랩 95% 하한 > 0, 슬리피지 0.3% 에서도 투입 자본 연환산 > 0 -> '우위 확인'. 17장 소액 실거래 승인 기준 심사로 넘어간다"
period_dependent = "거래당 평균 > 0 이지만 위 조건 중 하나라도 실패 -> '시기 의존'. 실거래 금지, 15~17장은 시스템 검증 목적의 모의매매로만 진행"
rejected = "거래당 평균 <= 0 -> 'H1 기각 확정'. 실거래 금지, 15~17장은 시스템 검증 목적의 모의매매로만 진행"
